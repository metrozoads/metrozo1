<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metrozo One</title>
<meta name="theme-color" content="#0F1B3C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metrozo One">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<style>
html,body{margin:0;height:100%;background:#0F1B3C;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0F1B3C}
/* instant look-alike of the login page, shown while the real one loads */
#splash{position:fixed;inset:0;z-index:5;overflow:auto;background:radial-gradient(520px 360px at 85% 8%,rgba(40,110,220,.35),transparent 60%),radial-gradient(520px 420px at 100% 100%,rgba(198,96,31,.35),transparent 60%),linear-gradient(180deg,#0c2a6b 0%,#0F1B3C 70%);display:flex;flex-direction:column;align-items:center;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash .br{text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 20px 18px;color:#fff}
#splash .br img{width:min(190px,54vw);display:block;margin:0 auto}
#splash .br h1{font-size:26px;margin:12px 0 2px;font-weight:800;letter-spacing:-.01em}
#splash .br h1 b{color:#ff7a2f}
#splash .br p{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#b4c0d8}
#splash .cd{width:calc(100% - 28px);max-width:470px;box-sizing:border-box;border-radius:24px;background:#fff;padding:26px 22px 20px;box-shadow:0 30px 60px -24px rgba(0,0,0,.6)}
#splash .cd h2{margin:0;font-size:22px;color:#0F1B3C}
#splash .cd .s{margin:4px 0 16px;font-size:13.5px;color:#4B5E86}
#splash .sk{height:50px;border-radius:12px;margin-bottom:14px;background:#F6F9FE;border:1.5px solid #C9D6EA;position:relative;overflow:hidden}
#splash .sk:after,#splash .go:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sh 1.3s infinite}
#splash .lb{height:11px;width:80px;border-radius:6px;background:#dbe4f3;margin:0 0 7px}
#splash .go{height:52px;border-radius:14px;background:#E8660A;margin-top:6px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:.08em;font-size:14px}
#splash .ft{text-align:center;color:#6d7fa3;font-size:11.5px;margin-top:14px}
@keyframes sh{to{transform:translateX(100%)}}
#fb{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:none;text-align:center;color:#c8d7ec;font-size:13px;line-height:1.5}
#fb a{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:12px;background:#ff7a2f;color:#1b1000;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<!-- the app starts loading immediately (src is in the markup, not set later by script) -->
<iframe id="app" title="Metrozo One" src="https://script.google.com/macros/s/AKfycbwOOh3zkcz1yaAMGVXgBCnuBkUkED6NTDxCktUntsmoy6EFdNdkckSeELrQLCgvNrPQBQ/exec" allow="microphone *; camera *; clipboard-read *; clipboard-write *; fullscreen *; geolocation *; autoplay *; encrypted-media *; picture-in-picture *; screen-wake-lock *" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="splash">
  <div class="br"><img src="logo.png" alt="Metrozo Ads"><h1>Metrozo <b>One</b></h1><p>Enterprise Management System</p></div>
  <div class="cd"><h2>Welcome back</h2><div class="s">Sign in and make today count.</div>
    <div class="lb"></div><div class="sk"></div><div class="lb"></div><div class="sk"></div>
    <div class="go">LOADING...</div><div class="ft">Secure sign-in · Metrozo Ads Internal Operations System</div></div>
</div>
<div id="fb">Taking long to open?<br><a id="fbA" href="#" target="_top">Open Metrozo One directly</a></div>
<script>
(function () {
  var f = document.getElementById("app"), sp = document.getElementById("splash"), fb = document.getElementById("fb"), a = document.getElementById("fbA");
  a.href = f.getAttribute("src");
  var done = false;
  function show() { if (done) return; done = true; sp.classList.add("off"); fb.style.display = "none"; }
  f.addEventListener("load", function () { setTimeout(show, 250); });
  setTimeout(function () { if (!done) fb.style.display = "block"; }, 12000);
  setTimeout(show, 20000);
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
})();
</script>
</body>
</html>
